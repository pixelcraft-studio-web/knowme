<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KnowMe 💌</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 15px;
}

body {
    margin: 0;
    padding: 24px 14px;
    font-family: "Trebuchet MS", Arial, sans-serif;
    text-align: center;
    color: #704768;
    background: linear-gradient(
        135deg,
        #fff0f6,
        #f0e8ff,
        #fff7ed
    );
    min-height: 100vh;
}
.decor {
    font-size: 25px;
    margin: 12px 0;
    animation: float 2.5s ease-in-out infinite alternate;
}

@keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(-5px); }
}

h1 {
    font-size: clamp(34px, 8vw, 46px);
    color: #c0528c;
    margin: 12px 0;
    letter-spacing: 1px;
}

.subtitle {
    font-size: 16px;
    line-height: 1.8;
    color: #896a88;
    margin: 12px auto;
}

.character {
    font-size: 68px;
    margin: 18px 0;
    filter: drop-shadow(0 5px 6px #e8bad5);
}

.card {
    background: rgba(255, 255, 255, 0.94);
    max-width: 480px;
    width: 100%;
    margin: 22px auto;
    padding: 26px 20px;
    border: 1px solid #f2c8df;
    border-radius: 26px;
    box-shadow: 0 12px 35px rgba(171, 112, 158, 0.14);
}

h2 {
    color: #a65391;
    font-size: 24px;
    line-height: 1.5;
    margin: 8px 0 14px;
}

p {
    line-height: 1.8;
}

input[type="text"] {
    display: block;
    width: 100%;
    padding: 15px;
    border: 2px solid #efd1e5;
    border-radius: 14px;
    font-size: 16px;
    font-family: inherit;
    color: #694563;
    background: #fffafd;
    outline: none;
    margin: 16px 0;
}

input[type="text"]:focus {
    border-color: #bd78b8;
    box-shadow: 0 0 0 4px #f6e7f5;
}
