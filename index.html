<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KnowMe 💌</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 15px;
}

body {
    margin: 0;
    padding: 24px 14px;
    font-family: "Trebuchet MS", Arial, sans-serif;
    text-align: center;
    color: #704768;
    background: linear-gradient(
        135deg,
        #fff0f6,
        #f0e8ff,
        #fff7ed
    );
    min-height: 100vh;
}
.decor {
    font-size: 25px;
    margin: 12px 0;
    animation: float 2.5s ease-in-out infinite alternate;
}

@keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(-5px); }
}

h1 {
    font-size: clamp(34px, 8vw, 46px);
    color: #c0528c;
    margin: 12px 0;
    letter-spacing: 1px;
}

.subtitle {
    font-size: 16px;
    line-height: 1.8;
    color: #896a88;
    margin: 12px auto;
}

.character {
    font-size: 68px;
    margin: 18px 0;
    filter: drop-shadow(0 5px 6px #e8bad5);
}

.card {
    background: rgba(255, 255, 255, 0.94);
    max-width: 480px;
    width: 100%;
    margin: 22px auto;
    padding: 26px 20px;
    border: 1px solid #f2c8df;
    border-radius: 26px;
    box-shadow: 0 12px 35px rgba(171, 112, 158, 0.14);
}

h2 {
    color: #a65391;
    font-size: 24px;
    line-height: 1.5;
    margin: 8px 0 14px;
}

p {
    line-height: 1.8;
}

input[type="text"] {
    display: block;
    width: 100%;
    padding: 15px;
    border: 2px solid #efd1e5;
    border-radius: 14px;
    font-size: 16px;
    font-family: inherit;
    color: #694563;
    background: #fffafd;
    outline: none;
    margin: 16px 0;
}

    
input[type="text"]:focus {
    border-color: #bd78b8;
    box-shadow: 0 0 0 4px #f6e7f5;
}
button {
    background: linear-gradient(135deg, #dc79ad, #a77bd3);
    color: white;
    border: none;
    border-radius: 15px;
    padding: 14px 22px;
    font-size: 16px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    margin: 10px 4px;
    box-shadow: 0 5px 13px rgba(177, 109, 174, 0.22);
    transition: transform 0.2s, box-shadow 0.2s;
}

button:active {
    transform: scale(0.97);
}

.option {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff7fb;
    color: #76536f;
    border: 2px solid #f0d6e7;
    width: 100%;
    margin: 9px 0;
    padding: 13px 14px;
    border-radius: 15px;
    cursor: pointer;
    text-align: left;
    font-size: 16px;
    line-height: 1.6;
    transition: background 0.2s, border-color 0.2s;
}

.option input[type="radio"] {
    width: 19px;
    height: 19px;
    margin: 0;
    flex-shrink: 0;
    accent-color: #bd69a8;
}

.option.selected {
    background: #f4e5fb;
    border-color: #b77acb;
}

.question {
    text-align: left;
    padding: 16px 0;
    border-bottom: 1px solid #f0dce9;
}

.question h3 {
    color: #96568e;
    font-size: 17px;
    line-height: 1.7;
    margin: 5px 0 14px;
}
    #quiz {
    display: none;
    scroll-margin-top: 12px;
}

#message,
#result {
    font-weight: bold;
    line-height: 1.8;
    color: #a65391;
    overflow-wrap: anywhere;
}

footer {
    font-size: 13px;
    line-height: 1.8;
    margin: 28px 0 12px;
    color: #946e98;
}

@media (max-width: 380px) {
    body {
        padding: 16px 10px;
    }

    .card {
        padding: 22px 15px;
        border-radius: 22px;
    }

    .option {
        padding: 12px 10px;
        font-size: 15px;
    }

    h2 {
        font-size: 21px;
    }
}
</style>
</head>

<body>
    <div class="decor">💗 ✨ 💌 ✨ 💗</div>
<h1>KnowMe 🎀</h1>

<p class="subtitle">
    A little quiz, a lot of memories! 💕<br>
    Let's see who knows you best.
</p>

<div class="character">👧🏻 🐱</div>

<div class="card" id="home">
    
    <h2>Welcome, bestie! 💌</h2>
    <button type="button" onclick="showCreateQuiz()">
    ➕ Create My Own Quiz
    </button>
    <p>Let's see how much you know me ☺️🌹</p>

    <input id="name" type="text"
        placeholder="Enter your name...">

    <button type="button" onclick="startQuiz()">
        Let's Play! 💖
    </button>

    <p id="message"></p>
</div>
    <div class="card" id="createQuiz" style="display:none;">
    <h2>Create Your Own Quiz 🎀</h2>

    <input type="text" id="creatorName"
        placeholder="Your name">

    <button type="button" onclick="saveQuiz()">
        Create My Quiz 💗
    </button>
    </div>
    
    <div class="card" id="quiz">
    <div class="decor">🌷 💕 🌷</div>

    <h2 id="welcome"></h2>

    <p>Choose one answer for every question! 🐰</p>

    <div id="questions"></div>

    <button type="button" onclick="finishQuiz()">
        Finish My Quiz 💌
    </button>

    <p id="result"></p>
</div>

<footer>
    Made with 💗, sparkles ✨ and a little magic 🎀
</footer>

<script>
const quizData = [
    {
        question: "1. What's my favourite food?",
        options: ["🍕 Pizza", "🍔 Burger", "🍟 Fries", "🍦 Ice cream"]
    },
    {
        question: "2. What's my favourite colour?",
        options: ["💜 Purple", "💗 Pink", "💙 Blue", "🖤 Black"]
    },
        {
        question: "3. Which animal do I love?",
        options: ["🐱 Cat", "🐶 Dog", "🐰 Rabbit", "🦋 Butterfly"]
    },
    {
        question: "4. What's my favourite subject?",
        options: ["💻 Computer", "📚 English", "🔢 Maths", "🔬 Science"]
    },
    {
        question: "5. What's my dream destination?",
        options: ["🕋 Makkah", "🇹🇷 Turkey", "🇸🇦 Madina", "🇨🇭 Switzerland"]
    },
    {
        question: "6. What's my favourite season?",
        options: ["❄️ Winter", "🌧️ Rainy", "☀️ Summer", "🌸 Spring"]
    },
    {
        question: "7. What's my favourite drink?",
        options: ["🥤 Cold drink", "☕ Coffee", "🧋 Milkshake", "🍹 Juice"]
    },
        {
        question: "8. What do I enjoy doing?",
        options: ["💻 Coding", "🎨 Drawing", "🎮 Gaming", "📖 Reading"]
    },
    {
        question: "9. What's my dream career?",
        options: ["💻 Web Designer", "👩‍⚕️ Doctor", "👩‍🏫 Teacher", "✈️ Pilot"]
    },
    {
        question: "10. What makes me happiest?",
        options: ["👨‍👩‍👧‍👦 Family time", "🎁 Getting gifts", "🛍️ Shopping", "✈️ Travelling"]
    }
];

let selectedAnswers = {};

function startQuiz() {
    const name = document.getElementById("name").value.trim();

    if (name === "") {
        alert("Please enter your name first! 💗");
        
        return;
    }

    document.getElementById("home").style.display = "none";
    document.getElementById("quiz").style.display = "block";
    document.getElementById("welcome").textContent = "Hey " + name + "! 💖";
    selectedAnswers = {};
    document.getElementById("result").textContent = "";

    showQuestions();

    document.getElementById("quiz").scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

function showQuestions() {
    const container = document.getElementById("questions");
    container.innerHTML = "";

    quizData.forEach(function(item, index) {
        const div = document.createElement("div");
        div.className = "question";

        const heading = document.createElement("h3");
        heading.textContent = item.question;
        div.appendChild(heading);
                item.options.forEach(function(option, optionIndex) {
            const label = document.createElement("label");
            label.className = "option";

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = "question" + index;
            radio.value = optionIndex;

            radio.addEventListener("change", function() {
                selectedAnswers[index] = optionIndex;

                div.querySelectorAll(".option").forEach(function(opt) {
                    opt.classList.remove("selected");
                });

                label.classList.add("selected");
            });

            label.appendChild(radio);
            label.appendChild(document.createTextNode(" " + option));
            div.appendChild(label);
        });

        container.appendChild(div);
    });
}
function showCreateQuiz() {
    document.getElementById("home").style.display = "none";
    document.getElementById("quiz").style.display = "none";
    document.getElementById("createQuiz").style.display = "block";
}
    function saveQuiz() {
    const creator = document.getElementById("creatorName").value.trim();
    const title = document.getElementById("quizTitle").value.trim();

    if (!creator || !title) {
        alert("Please enter your name and quiz title! 💗");
        return;
    }

    document.getElementById("createQuiz").innerHTML = `
        <h2>${title}</h2>
        <p>Created by ${creator} 🎀</p>
        <p>Your quiz setup has started! 💕</p>
        <button type="button" onclick="location.reload()">
            Back to Home
        </button>
    `;
    }
    let customQuestions = [];

function addQuestion() {
    const question = document.getElementById("customQuestion").value.trim();
    const options = [
        document.getElementById("option1").value.trim(),
        document.getElementById("option2").value.trim(),
        document.getElementById("option3").value.trim(),
        document.getElementById("option4").value.trim()
    ];

    if (!question || options.some(option => option === "")) {
        alert("Please fill in the question and all 4 options! 💗");
        return;
    }

    const box = document.createElement("div");
    box.className = "question";

    const heading = document.createElement("h3");
    heading.textContent = question;
    box.appendChild(heading);

    options.forEach((option, index) => {
        const label = document.createElement("label");
        label.className = "option";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "correctAnswer" + customQuestions.length;
        radio.value = index;

        label.appendChild(radio);
        label.appendChild(document.createTextNode(" " + option));
        box.appendChild(label);
    });

    const saveButton = document.createElement("button");
    saveButton.type = "button";
    saveButton.textContent = "Save Question 💾";

    saveButton.onclick = function() {
        const selected = box.querySelector('input[type="radio"]:checked');

        if (!selected) {
            alert("Please select the correct answer! 💕");
            return;
        }

        customQuestions.push({
            question: question,
            options: options,
            correctAnswer: Number(selected.value)
        });

        heading.textContent = "✅ " + question + " (Saved)";
        saveButton.remove();
        alert("Question saved! 💗");
    };

    box.appendChild(saveButton);
    document.getElementById("addedQuestions").appendChild(box);

    document.getElementById("customQuestion").value = "";
    options.forEach((_, index) => {
        document.getElementById("option" + (index + 1)).value = "";
    });
}
function finishQuiz() {
    if (Object.keys(selectedAnswers).length !== quizData.length) {
        alert("Please answer all 10 questions! 💕");
        return;
    }

    document.getElementById("result").textContent =
        "You completed all 10 questions! 💗 Thanks for playing KnowMe! 🎉";

    document.getElementById("result").scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}
</script>

</body>
</html>
