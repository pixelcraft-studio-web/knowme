<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KnowMe 💌</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 15px;
}

body {
    margin: 0;
    padding: 24px 14px;
    font-family: "Trebuchet MS", Arial, sans-serif;
    text-align: center;
    color: #704768;
    background: linear-gradient(
        135deg,
        #fff0f6,
        #f0e8ff,
        #fff7ed
    );
    min-height: 100vh;
}
.decor {
    font-size: 25px;
    margin: 12px 0;
    animation: float 2.5s ease-in-out infinite alternate;
}

@keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(-5px); }
}

h1 {
    font-size: clamp(34px, 8vw, 46px);
    color: #c0528c;
    margin: 12px 0;
    letter-spacing: 1px;
}

.subtitle {
    font-size: 16px;
    line-height: 1.8;
    color: #896a88;
    margin: 12px auto;
}

.character {
    font-size: 68px;
    margin: 18px 0;
    filter: drop-shadow(0 5px 6px #e8bad5);
}

.card {
    background: rgba(255, 255, 255, 0.94);
    max-width: 480px;
    width: 100%;
    margin: 22px auto;
    padding: 26px 20px;
    border: 1px solid #f2c8df;
    border-radius: 26px;
    box-shadow: 0 12px 35px rgba(171, 112, 158, 0.14);
}

h2 {
    color: #a65391;
    font-size: 24px;
    line-height: 1.5;
    margin: 8px 0 14px;
}

p {
    line-height: 1.8;
}

input[type="text"] {
    display: block;
    width: 100%;
    padding: 15px;
    border: 2px solid #efd1e5;
    border-radius: 14px;
    font-size: 16px;
    font-family: inherit;
    color: #694563;
    background: #fffafd;
    outline: none;
    margin: 16px 0;
}

    
input[type="text"]:focus {
    border-color: #bd78b8;
    box-shadow: 0 0 0 4px #f6e7f5;
}
button {
    background: linear-gradient(135deg, #dc79ad, #a77bd3);
    color: white;
    border: none;
    border-radius: 15px;
    padding: 14px 22px;
    font-size: 16px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    margin: 10px 4px;
    box-shadow: 0 5px 13px rgba(177, 109, 174, 0.22);
    transition: transform 0.2s, box-shadow 0.2s;
}

button:active {
    transform: scale(0.97);
}

.option {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff7fb;
    color: #76536f;
    border: 2px solid #f0d6e7;
    width: 100%;
    margin: 9px 0;
    padding: 13px 14px;
    border-radius: 15px;
    cursor: pointer;
    text-align: left;
    font-size: 16px;
    line-height: 1.6;
    transition: background 0.2s, border-color 0.2s;
}

.option input[type="radio"] {
    width: 19px;
    height: 19px;
    margin: 0;
    flex-shrink: 0;
    accent-color: #bd69a8;
}

.option.selected {
    background: #f4e5fb;
    border-color: #b77acb;
}

.question {
    text-align: left;
    padding: 16px 0;
    border-bottom: 1px solid #f0dce9;
}

.question h3 {
    color: #96568e;
    font-size: 17px;
    line-height: 1.7;
    margin: 5px 0 14px;
}
    #quiz {
    display: none;
    scroll-margin-top: 12px;
}

#message,
#result {
    font-weight: bold;
    line-height: 1.8;
    color: #a65391;
    overflow-wrap: anywhere;
}

footer {
    font-size: 13px;
    line-height: 1.8;
    margin: 28px 0 12px;
    color: #946e98;
}

@media (max-width: 380px) {
    body {
        padding: 16px 10px;
    }

    .card {
        padding: 22px 15px;
        border-radius: 22px;
    }

    .option {
        padding: 12px 10px;
        font-size: 15px;
    }

    h2 {
        font-size: 21px;
    }
}
</style>
</head>

<body>
