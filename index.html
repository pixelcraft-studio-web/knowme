<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KnowMe 💌</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 12px;
    font-family: "Trebuchet MS", Arial, sans-serif;
    text-align: center;
    color: #75466f;
    background: linear-gradient(135deg, #fff0f5, #eee5ff, #fff6e9);
    min-height: 100vh;
}

.decor {
    font-size: 25px;
    margin: 8px;
    animation: float 2s infinite alternate;
}

@keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(-7px); }
}

h1 {
    font-size: 38px;
    color: #c45b91;
    margin-bottom: 8px;
}

.subtitle {
    font-size: 16px;
    line-height: 1.6;
}

.character {
    font-size: 75px;
    margin: 12px;
    filter: drop-shadow(0 5px 5px #e8bad5);
}

.card {
    background: rgba(255,255,255,0.88);
    max-width: 460px;
    width: 100%;
    margin: 20px auto;
    padding: 24px 18px;
    border: 2px solid #f6c9df;
    border-radius: 26px;
    box-shadow: 0 8px 25px #d9b8d755;
}

h2 {
    color: #a65391;
}

input {
    width: 90%;
    padding: 14px;
    border: 2px solid #e9b8d8;
    border-radius: 14px;
    font-size: 16px;
    outline: none;
    margin: 10px 0;
}

input:focus {
    border-color: #b56ac2;
}

button {
    background: linear-gradient(135deg, #d978ad, #a979d5);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 13px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 6px;
}

button:active {
    transform: scale(0.97);
}

.option {
    background: #fff0f7;
    color: #87527d;
    border: 2px solid #f0c5df;
    width: 100%;
    margin: 5px 0;
}

.option.selected {
    background: #e5c8f5;
    border-color: #a979d5;
}

.question {
    text-align: left;
    padding: 13px 0;
    border-bottom: 1px dashed #ecc9e3;
}

#quiz {
    display: none;
}

#message, #result {
    font-weight: bold;
    line-height: 1.6;
}

footer {
    font-size: 13px;
    margin: 25px 0 10px;
    color: #946e98;
}
</style>
</head>

<body>

<div class="decor">💗 ✨ 💌 ✨ 💗</div>

<h1>KnowMe 🎀</h1>

<p class="subtitle">
    A little quiz, a lot of memories! 💕<br>
    Let's see who knows you best.
</p>

<div class="character">👧🏻 🐱</div>

<div class="card" id="home">
    <h2>Welcome, bestie! 💌</h2>
    <p>let's see how much you know me ☺️🌹?</p>

    <input id="name" type="text" placeholder="Enter your name...">

    <br>

    <button type="button" onclick="startQuiz()">Let's Play! 💖</button>

    <p id="message"></p>
</div>

<div class="card" id="quiz">
  <div class="decor">🌷 💕 🌷</div>

    <h2 id="welcome"></h2>

    <p>Choose one answer for every question! 🐰</p>

    <div id="questions"></div>

    <button onclick="finishQuiz()">Finish My Quiz 💌</button>

    <p id="result"></p>
</div>

<footer>
    Made with 💗, sparkles ✨ and a little magic 🎀
</footer>

<script>
const quizData = [
{
    question: "1. What's my favourite food?",
    options: ["🍕 Pizza", "🍔 Burger", "🍟 Fries", "🍦 Ice cream"]
},
{
    question: "2. What's my favourite colour?",
    options: ["💜 Purple", "💗 Pink", "💙 Blue", "🖤 Black"]
},
{
    question: "3. Which animal do I love?",
        options: ["🐱 Cat", "🐶 Dog", "🐰 Rabbit", "🦋 Butterfly"]
},
{
    question: "4. What's my favourite subject?",
    options: ["💻 Computer", "📚 English", "🔢 Maths", "🔬 Science"]
},
{
    question: "5. What's my dream destination?",
    options: ["🕋 Makkah", "🇹🇷 Turkey", "🇸🇦 Madina", "🇨🇭 Switzerland"]
},
{
    question: "6. What's my favourite season?",
    options: ["❄️ Winter", "🌧️ Rainy", "☀️ Summer", "🌸 Spring"]
},
{
    question: "7. What's my favourite drink?",
    options: ["☕ Coffee", "🥤 Cold drink", "🧃 Juice", "🥛 Milkshake"]
},
{
    question: "8. What do I enjoy doing?",
    options: ["🎬 Watching dramas", "🎮 Playing games", "📖 Reading", "🎨 Drawing"]
},
{
    question: "9. What's my dream career?",
    options: ["💻 Web Designer", "👩‍🏫 Teacher", "👩‍⚕️ Doctor", "✈️ Pilot"]
},
{
    question: "10. What makes me happiest?",
    options: ["👨‍👩‍👧‍👦 Family time", "🎁 Gifts", "🍫 Chocolates", "✈️ Travelling"]
}
];

let currentQuestion = 0;
let score = 0;
let selectedAnswers = {};

function startQuiz() {
    const name = document.getElementById("name").value.trim();

    if (!name) {
        alert("Please enter your name first! 💗");
    return;
    }

    alert("Button is working! 💖");
    

    document.getElementById("home").style.display = "none";
document.getElementById("quiz").style.display = "block";

showQuestions();

document.getElementById("quiz").scrollIntoView({
    behavior: "smooth",
    block: "start"
});
}

function showQuestions() {
    const container = document.getElementById("questions");

    container.innerHTML = "";

    quizData.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "question";

        const heading = document.createElement("h3");
        heading.textContent = item.question;
        div.appendChild(heading);

        item.options.forEach((option, optionIndex) => {
            const label = document.createElement("label");
            label.className = "option";

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = "question" + index;
            radio.value = optionIndex;

            radio.addEventListener("change", function () {
                selectedAnswers[index] = optionIndex;
            });

            label.appendChild(radio);
            label.appendChild(document.createTextNode(" " + option));
            div.appendChild(label);
        });

        container.appendChild(div);
    });
}

function finishQuiz() {
    const answered = Object.keys(selectedAnswers).length;

    if (answered !== quizData.length) {
        alert("Please answer all 10 questions! 💕");
        return;
    }

    document.getElementById("result").textContent =
        "You completed all 10 questions! 💗";

    document.getElementById("message").textContent =
        "Thanks for playing KnowMe! 🎉";
} </script>
</body>
</html>
