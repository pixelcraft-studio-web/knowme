
<!DOCTYPE html><html><head><title>KnowMe</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body {background: lavender;text-align: center;font-family: Arial;color: purple;}.card {background: white;padding: 20px;margin: 15px auto;border-radius: 15px;max-width: 400px;}input {padding: 10px;border-radius: 8px;border: 1px solid purple;}button {background: purple;color: white;padding: 12px 20px;border: none;border-radius: 10px;font-size: 16px;}.options {display: flex;flex-wrap: wrap;justify-content: center;gap: 8px;}.option {background: #f1e5ff;color: purple;padding: 12px;border: 2px solid #d8b5ff;border-radius: 10px;}.option.selected {background: #d8b5ff;}.question {padding: 12px;border-bottom: 1px solid #eee;}#quiz {display: none;}</style></head><body><h1>💌 KnowMe</h1><p><b>How Well Do You Know Me?</b></p><p>Create a quiz and challenge your friends! 💜</p><div class="card" id="home"><h2>Welcome! ✨</h2><p>Enter your name to begin</p><input id="name" type="text"placeholder="Enter your name"><br><br><button onclick="startQuiz()">Start My Quiz 💌</button><p id="message"></p></div><div class="card" id="quiz"><h2 id="welcome"></h2><p>Choose your favourite answer for each question! 💜</p><div id="questions"></div><button onclick="finishQuiz()">Save My Answers 💌</button><p id="result"></p></div><script>const quizData = [{question: "1. My favourite food?",options: ["🍕 Pizza", "🍔 Burger", "🍟 Fries", "🍦 Ice cream"]},{question: "2. My favourite colour?",options: ["💜 Purple", "💗 Pink", "💙 Blue", "🖤 Black"]},{question: "3. My favourite animal?",options: ["🐱 Cat", "🐶 Dog", "🐰 Rabbit", "🦋 Butterfly"]},{question: "4. My favourite drink?",options: ["🥤 Juice", "☕ Coffee", "🥛 Milk", "🍹 Lemonade"]},{question: "5. My dream destination?",options: ["🏖️ Beach", "🏔️ Mountains", "🗼 Paris", "🕋 Makkah"]},{question: "6. My favourite season?",options: ["🌧️ Rainy", "❄️ Winter", "☀️ Summer", "🌸 Spring"]},{question: "7. My favourite dessert?",options: ["🍰 Cake", "🍫 Chocolate", "🍩 Donut", "🍨 Ice cream"]},{question: "8. My favourite hobby?",options: ["🎨 Drawing", "🎵 Music", "📚 Reading", "🎮 Gaming"]},{question: "9. My dream job?",options: ["💻 Designer", "👩‍⚕️ Doctor", "👩‍🏫 Teacher", "🚀 Astronaut"]},{question: "10. My favourite flower?",options: ["🌹 Rose", "🌻 Sunflower", "🌷 Tulip", "🌼 Daisy"]}];function startQuiz() {let name = document.getElementById("name").value.trim();if (name === "") {document.getElementById("message").innerText ="Please enter your name! 💜";return;}document.getElementById("home").style.display = "none";document.getElementById("quiz").style.display = "block";document.getElementById("welcome").innerText =name + "'s KnowMe Quiz 💌";showQuestions();}let selectedAnswers = {};function showQuestions() {let area = document.getElementById("questions");quizData.forEach(function(item, index) {let section = document.createElement("div");section.className = "question";let heading = document.createElement("p");heading.innerText = item.question;section.appendChild(heading);let options = document.createElement("div");options.className = "options";item.options.forEach(function(option) {let btn = document.createElement("button");btn.className = "option";btn.innerText = option;btn.onclick = function() {selectedAnswers[index] = option;options.querySelectorAll("button").forEach(function(b) {b.classList.remove("selected");});btn.classList.add("selected");};options.appendChild(btn);});section.appendChild(options);area.appendChild(section);});}function finishQuiz() {if (Object.keys(selectedAnswers).length < 10) {document.getElementById("result").innerText ="Please answer all 10 questions! 💜";return;}document.getElementById("result").innerText ="All 10 answers selected! 💌 Your quiz is ready!";}</script></body></html>
